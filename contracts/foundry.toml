[profile.default]
# Wave-5 kickoff contract (vault): pinned solc for EIP-1167 factory+template
# work; evm_version stays at the solc default until Base fork tests say
# otherwise; optimizer on with runs=200.
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
src = "src"
test = "test"
script = "script"
libs = ["lib"]

# T21 §4.4 campaign params (wave5-t21-verification-design.md): runs >= 256,
# depth >= 100, no fail-on-revert (reverting paths are expected in handlers).
[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false

[fmt]
line_length = 100
