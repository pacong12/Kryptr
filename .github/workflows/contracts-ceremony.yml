name: Contracts ceremony (S3)

# Wave-6 S3 signing-ceremony automation — PREPARE + PUBLISH and POST-BROADCAST
# VERIFY only (wave6-s2-signing-ceremony.md §5/§6/§8; Main dispatch ruling
# 2026-08-17). Frozen posture, inherited:
#
#   - NO signing key anywhere: no PRIVATE_KEY is ever wired into this
#     workflow, and a key-shaped-env guard step refuses to run if one ever
#     appears (fail-closed). Signing remains the ONLY manual step, on the
#     operator's own device (§6).
#   - NO broadcast from CI: this workflow assembles and publishes the exact
#     calldata; the operator signs and broadcasts from their own wallet
#     (wallet -> operator's RPC). There is no broadcast code in this repo.
#   - P5 verbatim discipline: the kit's `data` and `calldataKeccak` fields
#     flow into the ceremony payload VERBATIM — never re-rendered, never
#     re-encoded, never re-hashed after publication.
#   - P1: calldataKeccak is published (committed payload + job summary)
#     BEFORE any signing happens.
#   - P7: every payload is TESTNET-stamped with an explicit chainId;
#     testnet PASS != mainnet PASS.
#   - Robinhood RPC quirk (#98 runbook note): this RPC rejects JSON-RPC
#     batch arrays with HTTP 403 — every RPC call below is a SINGLE call,
#     never a batch.
#   - Provenance records releaseTag and toolingCommit SEPARATELY
#     (#96 §10.1): the kit source comes from the tag checkout; the
#     assembly tooling comes from the dispatching ref (github.sha).
#   - Input hygiene (Review54 #104 verdict): dispatch inputs NEVER appear
#     as `${{ ... }}` interpolations inside bash run blocks. They enter
#     once, at job-level `env:` (or in a non-shell `with:` parameter that
#     GitHub resolves server-side), and bash only ever reads `$IN_*`
#     variables. verify's `payload_ref` is additionally shape-validated in
#     a dedicated job BEFORE it reaches `checkout ref:`.
#
# Two dispatch actions (each a separate, deliberate act — same dispatch-only
# philosophy as release-tag.yml):
#
#   action=prepare : checkout the release tag -> run the offline kit emitter
#     -> keyless nonce read (advisory) -> assemble the ceremony payload ->
#     commit it on a ceremony branch (official channel, never overwritten:
#     a re-issue after an abort is a NEW file via a new `attempt`; the
#     branch MUST be merged back to main after the ceremony completes —
#     Main sign-off 2026-08-17: permanent audit trail + reviewer byte-diff
#     access live on main) -> publish calldataKeccak.
#
#   action=verify : post-broadcast backstop, dispatched manually AFTER the
#     operator broadcasts. Checks the scoped Main subset of §8:
#     P3  keccak256(tx.input)      == payload.calldataKeccak (THE gate)
#     P4  receipt.from             == payload.pinnedSender
#     P6  tx.nonce                 == payload.expectedNonce
#     +   receipt.status           == success
#     The FULL §8 gate is the third action:
#   action=g4-readback : the complete §8 ordered checks — P3, P4,
#     P6 (+ predicted-address structural check), receipt status, CODE
#     IDENTITY (on-chain runtime vs at-tag recompile; factory immutable
#     regions zero-masked, their VALUES verified by readback instead),
#     immutable readbacks (factory stage), and a transcript with full
#     provenance. REJECT = no stage PASS; recorded, never silently retried.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'prepare = build+publish payload; verify = quick post-broadcast checks; g4-readback = full §8 gate'
        required: true
        type: choice
        options:
          - prepare
          - verify
          - g4-readback
      release_tag:
        description: 'Contracts release tag to run the kit at (e.g. contracts-v0.1.0)'
        required: true
        type: string
      chain:
        description: 'Rehearsal chain (claims stay per-chain, P7)'
        required: true
        type: choice
        options:
          - base-sepolia
          - robinhood-46630
      stage:
        description: 'template (tx1) or factory (tx2; needs template_address from the stage-1 RECEIPT)'
        required: true
        type: choice
        options:
          - template
          - factory
      template_address:
        description: 'factory stage only: live template address from the stage-1 RECEIPT (never from a commit)'
        required: false
        default: ''
        type: string
      bond_sink:
        description: 'factory stage: must equal the pinned rehearsal sink (fail-closed otherwise)'
        required: false
        default: ''
        type: string
      attempt:
        description: '1 = first issue; after an abort use the next number (re-issue = NEW file, never overwrite)'
        required: true
        default: '1'
        type: string
      deploy_tx_hash:
        description: 'verify only: the broadcast tx hash reported by the operator'
        required: false
        default: ''
        type: string
      payload_ref:
        description: 'verify only: ref carrying the committed ceremony payload (ceremony branch or main after merge)'
        required: false
        default: ''
        type: string

permissions:
  contents: write # prepare pushes the ceremony branch carrying the payload commit

jobs:
  prepare:
    if: ${{ github.event.inputs.action == 'prepare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Inputs enter the shell environment exactly once, HERE (Review54 #104
    # hardening) — bash run blocks below only ever read $IN_* variables.
    env:
      IN_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
      IN_CHAIN: ${{ github.event.inputs.chain }}
      IN_STAGE: ${{ github.event.inputs.stage }}
      IN_TEMPLATE_ADDRESS: ${{ github.event.inputs.template_address }}
      IN_BOND_SINK: ${{ github.event.inputs.bond_sink }}
      IN_ATTEMPT: ${{ github.event.inputs.attempt }}
      TOOLING_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          ref: refs/tags/${{ github.event.inputs.release_tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # The kit emitter runs `forge script --offline`, which refuses to
      # download a missing compiler (S3 attempt-1 failure: "can't install
      # missing solc 0.8.24 in offline mode"). Pre-install 0.8.24 into the
      # svm cache — cached across runs; on cache hit the warmup is a no-op.
      - name: Cache solc 0.8.24 (~/.svm)
        uses: actions/cache@v4
        with:
          path: ~/.svm
          key: ${{ runner.os }}-solc-0.8.24

      - name: Ensure solc 0.8.24 is present before offline emitter
        working-directory: contracts
        run: |
          set -euo pipefail
          if ! ls "$HOME/.svm/0.8.24/"solc-* >/dev/null 2>&1; then
            echo "solc 0.8.24 not in svm cache — warming with one online build"
            forge build --skip test --skip script
          fi
          ls "$HOME/.svm/0.8.24/"solc-*

      # Key guard: this workflow must never run with key-shaped material in
      # the environment. Fail closed BEFORE anything else executes.
      - name: Key guard (fail-closed)
        run: |
          set -euo pipefail
          if env | cut -d= -f1 | grep -qiE 'PRIVATE_KEY|SECRET_KEY|SIGNING_KEY|MNEMONIC|HD_SEED'; then
            echo "key-shaped environment variable present — ceremony workflow refuses to run."
            exit 1
          fi
          echo "key guard: no key-shaped environment variables present"

      - name: Validate inputs and resolve chain constants
        run: |
          set -euo pipefail
          CHAIN="$IN_CHAIN"
          STAGE="$IN_STAGE"
          TAG="$IN_RELEASE_TAG"
          PINNED_SENDER="0x00e7bE21b70DD57bA2AAC3C32657304dDA6863C2"

          case "$CHAIN" in
            base-sepolia)    CHAIN_ID=84532; RPC="https://sepolia.base.org" ;;
            robinhood-46630) CHAIN_ID=46630; RPC="https://rpc.testnet.chain.robinhood.com" ;;
            *) echo "unknown chain: $CHAIN"; exit 1 ;;
          esac

          case "$TAG" in
            contracts-v*) ;;
            *) echo "release tag must look like contracts-v* (got: $TAG)"; exit 1 ;;
          esac

          if [ "$STAGE" = "factory" ]; then
            if ! [[ "$IN_TEMPLATE_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
              echo "factory stage requires template_address — the live address from the stage-1 RECEIPT."
              exit 1
            fi
            if [ -z "$IN_BOND_SINK" ]; then
              echo "factory stage requires bond_sink (pinned rehearsal sink: $PINNED_SENDER)."
              exit 1
            fi
          fi

          if [ -n "$IN_BOND_SINK" ] && [ "${IN_BOND_SINK,,}" != "${PINNED_SENDER,,}" ]; then
            echo "bond_sink differs from the pinned rehearsal sink — fail closed."
            exit 1
          fi

          if ! [[ "$IN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "attempt must be a positive integer (got: $IN_ATTEMPT)"
            exit 1
          fi

          {
            echo "CHAIN_ID=$CHAIN_ID"
            echo "RPC=$RPC"
            echo "PINNED_SENDER=$PINNED_SENDER"
            echo "ATTEMPT=$IN_ATTEMPT"
            echo "TAG_SHA=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          echo "inputs OK — chain=$CHAIN ($CHAIN_ID) stage=$STAGE tag=$TAG attempt=$IN_ATTEMPT"

      # The kit is offline by construction: no vm.broadcast, no chain reads,
      # no signing code. Run from the contracts/ subdir (fork-env lesson
      # does not apply offline, but the subdir keeps paths identical to the
      # battery targets).
      - name: Run kit emitter (offline)
        run: |
          set -euo pipefail
          cd contracts
          if [ "$IN_STAGE" = "template" ]; then
            KIT_STAGE=template forge script script/DeployKit.s.sol --offline
            OUT=deploy-kit-out/template-deploy.json
          else
            KIT_STAGE=factory \
            TEMPLATE_ADDRESS="$IN_TEMPLATE_ADDRESS" \
            BOND_SINK="$IN_BOND_SINK" \
            forge script script/DeployKit.s.sol --offline
            OUT=deploy-kit-out/factory-deploy.json
          fi
          test -s "$OUT"
          echo "KIT_JSON=contracts/$OUT" >> "$GITHUB_ENV"

      # Enrich kit output — ruling A (S3 design gap found by attempt-2)
      # plus the binding three-expert adendum (S1-S6, A1-A5). Tags cut
      # before the #102 emitter upgrade (e.g. contracts-v0.1.0) emit
      # MINIMAL kit JSON (kind/signer/to/value/data [+constructorArgs]);
      # assemble expects the enriched shape (stage/calldataKeccak/decoded/
      # frozenConstants). This step enriches deterministically WITHOUT
      # touching the bytes-to-sign:
      #   S1  data flows VERBATIM; sha256(data string) before == after.
      #   S2  tag JSON is the ONLY input — no RPC, no source re-derive,
      #       no re-encode of data; decode grammar proven by cast
      #       round-trip (A1): calldata-decode trailing args -> abi-encode
      #       back -> byte-identical. Blind echo prohibited.
      #   S3  frozen constants come from the workflow's frozen pins
      #       (175 bps / 10000000000000000 wei / pinned rehearsal sink),
      #       never from the tag JSON; decoded is cross-checked against
      #       them; factory template must equal the stage-1 receipt
      #       address (IN_TEMPLATE_ADDRESS).
      #   S4  publication stays keccak256(raw calldata) (P1); lineage
      #       TAG_SHA -> sha256(tag JSON) -> sha256(enriched JSON) ->
      #       published hash is exported for the ceremony record + G5;
      #       tooling-only justification cites the #102 byte-identity
      #       proof (4/4 sha256 + calldata byte-identical).
      #   S6  fail-closed on any missing/malformed field; atomic write
      #       (tmp file -> rename only after ALL asserts pass).
      #   A5  auto-skip passthrough when the tag JSON is already enriched
      #       (forward-compat with future enriched tags).
      - name: Enrich kit output (deterministic, tag-compat)
        run: |
          set -euo pipefail
          KIT="$KIT_JSON"
          fail() { echo "enrich: FAIL-CLOSED — $1"; exit 1; }

          TAG_JSON_SHA256=$(sha256sum "$KIT" | awk '{print $1}')
          echo "lineage: TAG_SHA=$TAG_SHA tagJSON sha256=$TAG_JSON_SHA256"

          KIND=$(jq -r '.kind // empty' "$KIT")
          TO=$(jq -c '.to' "$KIT")
          VALUE=$(jq -r '.value // empty' "$KIT")
          DATA=$(jq -r '.data // empty' "$KIT")
          [ "$KIND" = "${IN_STAGE}-deploy" ] || fail "kind '$KIND' != ${IN_STAGE}-deploy"
          [ "$TO" = "null" ] || fail "to must be null (contract creation)"
          [ "$VALUE" = "0x0" ] || fail "value must be 0x0"
          [[ "$DATA" =~ ^0x([0-9a-f]{2})+$ ]] || fail "data is not even-length lowercase hex"

          EMITTER_META="tag@${IN_RELEASE_TAG} (minimal)"
          ENRICHMENT_META="inline@${TOOLING_COMMIT}"

          if jq -e '.calldataKeccak and .decoded and .stage' "$KIT" >/dev/null 2>&1; then
            # A5 passthrough — already-enriched tag: re-verify keccak only.
            RECHECK=$(cast keccak "$DATA")
            PUB=$(jq -r '.calldataKeccak' "$KIT")
            [ "${RECHECK,,}" = "${PUB,,}" ] || fail "enriched tag JSON keccak != keccak(data)"
            EMITTER_META="tag@${IN_RELEASE_TAG} (enriched native)"
            ENRICHMENT_META="passthrough@${TOOLING_COMMIT}"
            echo "kit JSON already enriched — passthrough (keccak re-verified)"
          else
            CALC_KECCAK=$(cast keccak "$DATA")
            if [ "$IN_STAGE" = "factory" ]; then
              # G1-G3 (VaultAPI decode grammar; mirrors the tag's
              # DeployKitLib.decodeFactoryArgs). Creation code comes from
              # the TAG artifact — the emitter step just compiled the tag
              # checkout under the tag's own foundry profile (solc 0.8.24,
              # optimizer runs=200, cancun, bytecode_hash none), so out/
              # holds tag-profile bytecode by construction.
              ARTIFACT=contracts/out/TokenFactory.sol/KryptrTokenFactory.json
              [ -s "$ARTIFACT" ] || fail "kit: creation code prefix drift (tag artifact missing — fail-closed)"
              CODE_HEX=$(jq -r '.bytecode.object // empty' "$ARTIFACT")
              CODE_HEX="${CODE_HEX#0x}"
              [[ "$CODE_HEX" =~ ^([0-9a-f]{2})+$ ]] || fail "kit: creation code prefix drift (artifact bytecode malformed — fail-closed)"
              DATA_HEX="${DATA#0x}"
              # G1 truncation, then G2 exact-length — BEFORE any slicing.
              [ $(( ${#DATA_HEX} / 2 )) -ge $(( ${#CODE_HEX} / 2 + 128 )) ] || fail "kit: creation data truncated"
              [ $(( ${#DATA_HEX} )) -eq $(( ${#CODE_HEX} + 256 )) ] || fail "kit: args segment length drift"
              # G3 prefix identity.
              [ "${DATA_HEX:0:${#CODE_HEX}}" = "$CODE_HEX" ] || fail "kit: creation code prefix drift"

              # A1 round-trip: the constructor args are the trailing 128
              # bytes (4 static words). Decode via cast with a synthetic
              # selector, re-encode via abi-encode, demand byte-identity —
              # an independent decoder cross-check on top of G1-G3.
              ARGS_HEX="${DATA_HEX: -256}"
              SIG="kryptr_enrich(address,uint16,uint256,address)"
              SEL=$(cast sig "$SIG")
              DECODED=$(cast calldata-decode "$SIG" "${SEL}${ARGS_HEX}") || fail "cast calldata-decode rejected the trailing 128 bytes"
              D_TEMPLATE=$(printf '%s\n' "$DECODED" | sed -n 1p)
              D_FEE=$(printf '%s\n' "$DECODED" | sed -n 2p | awk '{print $1}')
              D_BOND=$(printf '%s\n' "$DECODED" | sed -n 3p | awk '{print $1}')
              D_SINK=$(printf '%s\n' "$DECODED" | sed -n 4p)
              ROUND=$(cast abi-encode "constructor(address,uint16,uint256,address)" "$D_TEMPLATE" "$D_FEE" "$D_BOND" "$D_SINK")
              [ "${ROUND,,}" = "0x${ARGS_HEX,,}" ] || fail "decode round-trip mismatch (arg boundary drift)"

              # S3 frozen asserts — values from workflow pins, not tag JSON.
              [ "$D_FEE" = "175" ] || fail "kit: decoded totalFeeBps drift ($D_FEE != frozen 175)"
              [ "$D_BOND" = "10000000000000000" ] || fail "kit: decoded bondAmount drift (!= frozen 0.01 ETH)"
              [ "${D_SINK,,}" = "${IN_BOND_SINK,,}" ] || fail "kit: decoded bondSink drift (!= pinned rehearsal sink)"
              [ "${D_TEMPLATE,,}" = "${IN_TEMPLATE_ADDRESS,,}" ] || fail "kit: decoded template drift (!= stage-1 receipt address)"

              # Secondary cross-check against the tag JSON's own echo.
              if jq -e '.constructorArgs' "$KIT" >/dev/null 2>&1; then
                [ "$(jq -r '.constructorArgs.totalFeeBps' "$KIT")" = "$D_FEE" ] || fail "tag JSON constructorArgs.totalFeeBps disagrees with decoded"
                [ "$(jq -r '.constructorArgs.bondAmountWei' "$KIT")" = "$D_BOND" ] || fail "tag JSON constructorArgs.bondAmountWei disagrees with decoded"
                [ "$(jq -r '.constructorArgs.bondSink' "$KIT" | tr 'A-Z' 'a-z')" = "${D_SINK,,}" ] || fail "tag JSON constructorArgs.bondSink disagrees with decoded"
                [ "$(jq -r '.constructorArgs.template' "$KIT" | tr 'A-Z' 'a-z')" = "${D_TEMPLATE,,}" ] || fail "tag JSON constructorArgs.template disagrees with decoded"
              fi
            else
              # Template stage: data must BYTE-EQUAL the template creation
              # code from the tag artifact (G3 analogue, no args segment).
              ARTIFACT=contracts/out/TokenTemplate.sol/KryptrLaunchTokenTemplate.json
              [ -s "$ARTIFACT" ] || fail "kit: template creation code drift (tag artifact missing — fail-closed)"
              CODE_HEX=$(jq -r '.bytecode.object // empty' "$ARTIFACT")
              CODE_HEX="${CODE_HEX#0x}"
              [[ "$CODE_HEX" =~ ^([0-9a-f]{2})+$ ]] || fail "kit: template creation code drift (artifact bytecode malformed — fail-closed)"
              [ "$(( ${#DATA} - 2 ))" -eq "${#CODE_HEX}" ] || fail "kit: template creation code drift (length mismatch)"
              [ "${DATA#0x}" = "$CODE_HEX" ] || fail "kit: template creation code drift (data != tag artifact creation code)"
              BYTECODE_SHA256="0x$(python3 -c 'import hashlib,sys;print(hashlib.sha256(bytes.fromhex(sys.argv[1][2:])).hexdigest())' "$DATA")"
            fi

            cat > /tmp/ceremony-enrich.mjs <<'EOF'
            import { readFileSync, writeFileSync, renameSync } from 'node:fs';
            import { createHash } from 'node:crypto';
            const env = process.env;
            const need = (k) => {
              const v = env[k];
              if (!v) { console.error(`enrich: missing ${k}`); process.exit(1); }
              return v;
            };
            const fail = (w) => { console.error(`enrich: FAIL-CLOSED — ${w}`); process.exit(1); };
            const sha256 = (s) => createHash('sha256').update(s, 'utf8').digest('hex');

            const kitPath = need('E_KIT');
            const stage = need('E_STAGE');
            const kit = JSON.parse(readFileSync(kitPath, 'utf8'));
            const dataBefore = kit.data;
            if (!/^0x(?:[0-9a-f]{2})+$/.test(dataBefore ?? '')) fail('data malformed at enrichment');
            const dataShaBefore = sha256(dataBefore);

            const decoded = stage === 'template'
              ? { kind: 'template-deploy', constructorArgs: [], bytecodeSha256: need('E_BYTECODE_SHA256') }
              : { kind: 'factory-deploy', constructorArgs: {
                  template: need('E_D_TEMPLATE').toLowerCase(),
                  totalFeeBps: Number(need('E_D_FEE')),
                  bondAmountWei: need('E_D_BOND'),
                  bondSink: need('E_D_SINK').toLowerCase(),
                } };

            const enriched = {
              kind: kit.kind,
              stage,
              signer: kit.signer,
              to: kit.to,
              value: kit.value,
              data: kit.data, // VERBATIM — bytes-to-sign never change (P5, S1)
              calldataKeccak: need('E_KECCAK').toLowerCase(),
              decoded,
              ...(stage === 'factory' ? { frozenConstants: {
                  totalFeeBps: Number(need('E_D_FEE')),
                  bondAmountWei: need('E_D_BOND'),
                  bondSink: need('E_D_SINK').toLowerCase(),
                } } : {}),
              enrichment: {
                emitter: need('E_EMITTER_META'),
                tooling: need('E_ENRICHMENT_META'),
                tagJsonSha256: need('E_TAG_JSON_SHA256'),
                dataStringSha256: dataShaBefore,
                justification: 'tooling-only enrichment of minimal tag output; calldata bytes byte-identical per #102 proof (4/4 sha256)',
              },
            };

            const tmp = `${kitPath}.tmp`;
            writeFileSync(tmp, JSON.stringify(enriched, null, 2) + '\n');
            // S1: prove the bytes-to-sign survived bit-identical.
            const written = JSON.parse(readFileSync(tmp, 'utf8'));
            if (written.data !== dataBefore) fail('data field altered during enrichment');
            if (sha256(written.data) !== dataShaBefore) fail('sha256(data) differs after enrichment');
            renameSync(tmp, kitPath); // atomic: publish only after ALL asserts
            console.log(`enrich: wrote enriched ${kitPath} (stage ${stage}, calldataKeccak ${enriched.calldataKeccak})`);
          EOF

            E_KIT="$KIT" E_STAGE="$IN_STAGE" E_KECCAK="$CALC_KECCAK" \
            E_TAG_JSON_SHA256="$TAG_JSON_SHA256" E_EMITTER_META="$EMITTER_META" \
            E_ENRICHMENT_META="$ENRICHMENT_META" E_D_TEMPLATE="${D_TEMPLATE:-}" \
            E_D_FEE="${D_FEE:-}" E_D_BOND="${D_BOND:-}" E_D_SINK="${D_SINK:-}" \
            E_BYTECODE_SHA256="${BYTECODE_SHA256:-}" node /tmp/ceremony-enrich.mjs
          fi

          ENRICHED_KIT_SHA256=$(sha256sum "$KIT" | awk '{print $1}')
          {
            echo "TAG_JSON_SHA256=$TAG_JSON_SHA256"
            echo "ENRICHED_KIT_SHA256=$ENRICHED_KIT_SHA256"
            echo "EMITTER_META=$EMITTER_META"
            echo "ENRICHMENT_META=$ENRICHMENT_META"
          } >> "$GITHUB_ENV"
          echo "lineage: TAG_SHA=$TAG_SHA -> tagJSON=$TAG_JSON_SHA256 -> enriched=$ENRICHED_KIT_SHA256"
      # Keyless nonce read — ONE single JSON-RPC call (never a batch array:
      # Robinhood RPC rejects batches with HTTP 403, #98). Advisory only:
      # the operator's wallet nonce at submit time is authoritative (P6
      # abort rule stays with the human).
      - name: Keyless nonce read (single call, advisory)
        run: |
          set -euo pipefail
          RESP=$(curl -sS -m 30 -X POST "$RPC" -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_getTransactionCount","params":["'"$PINNED_SENDER"'","latest"]}')
          echo "rpc response: $RESP"
          NONCE=$(printf '%s' "$RESP" | jq -r '.result // empty')
          if ! [[ "$NONCE" =~ ^0x[0-9a-f]+$ ]]; then
            echo "nonce read failed or malformed — fail closed (no payload publication)."
            exit 1
          fi
          echo "EXPECTED_NONCE=$NONCE" >> "$GITHUB_ENV"
          echo "pinned-sender nonce at $(date -u +%Y-%m-%dT%H:%M:%SZ): $NONCE"

      # Advisory CREATE address prediction — pure local computation
      # (rlp(sender, nonce) -> keccak -> last 20 bytes), no chain reads.
      # Receipt stays the truth; prediction is for the human checklist.
      - name: Predict address (offline, advisory)
        run: |
          set -euo pipefail
          NONCE_DEC=$(printf '%d' "$EXPECTED_NONCE") # cast takes decimal; payload keeps hex
          PRED=$(cast compute-address "$PINNED_SENDER" --nonce "$NONCE_DEC" | awk '{print $NF}')
          if ! [[ "$PRED" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
            echo "cast compute-address produced no address — fail closed."
            exit 1
          fi
          echo "PREDICTED_ADDRESS=$PRED" >> "$GITHUB_ENV"
          echo "advisory predicted address rlp(sender, $EXPECTED_NONCE): $PRED"

      # Assembly is inline tooling (ships with THIS workflow file, so the
      # toolingCommit recorded in provenance = github.sha, per #96 §10.1).
      # Kit fields `data` / `calldataKeccak` / `decoded` / `frozenConstants`
      # are copied VERBATIM — never re-rendered, never re-hashed (P5).
      - name: Assemble ceremony payload
        run: |
          set -euo pipefail
          cat > /tmp/ceremony-assemble.mjs <<'EOF'
          import { readFileSync, writeFileSync, mkdirSync } from 'node:fs';
          import { dirname } from 'node:path';

          const env = process.env;
          const need = (k) => {
            const v = env[k];
            if (!v) {
              console.error(`assemble: missing ${k}`);
              process.exit(1);
            }
            return v;
          };

          const PINNED = '0x00e7bE21b70DD57bA2AAC3C32657304dDA6863C2';
          const CHAIN_IDS = { 'base-sepolia': 84532, 'robinhood-46630': 46630 };
          const RPCS = {
            'base-sepolia': 'https://sepolia.base.org',
            'robinhood-46630': 'https://rpc.testnet.chain.robinhood.com',
          };

          const stage = need('C_STAGE');
          const chain = need('C_CHAIN');
          const tag = need('C_TAG');
          const kit = JSON.parse(readFileSync(need('C_KIT_JSON'), 'utf8'));

          const fail = (why) => {
            console.error(`assemble: FAIL-CLOSED — ${why}`);
            process.exit(1);
          };

          if (kit.stage !== stage) fail(`kit stage ${kit.stage} != requested ${stage}`);
          if (kit.to !== null) fail('deploy tx must be a contract creation (to: null)');
          if (kit.value !== '0x0') fail('deploy tx must carry value 0x0');
          if (!/^0x(?:[0-9a-f]{2})+$/.test(kit.data ?? '')) fail('kit data is not even-length lowercase hex');
          if (!/^0x[0-9a-f]{64}$/.test(kit.calldataKeccak ?? '')) fail('kit calldataKeccak malformed');
          if (typeof kit.decoded !== 'object' || kit.decoded === null) fail('kit decoded block missing');
          if (kit.decoded.kind !== `${stage}-deploy`) fail('decoded.kind mismatch');

          if (stage === 'factory') {
            const args = kit.decoded.constructorArgs;
            const fc = kit.frozenConstants;
            if (!args || !fc) fail('factory payload missing constructorArgs/frozenConstants');
            if (args.totalFeeBps !== 175 || fc.totalFeeBps !== 175) fail('totalFeeBps != frozen 175');
            if (args.bondAmountWei !== '10000000000000000' || fc.bondAmountWei !== '10000000000000000') {
              fail('bondAmount != frozen 0.01 ETH');
            }
            if ((args.bondSink ?? '').toLowerCase() !== PINNED.toLowerCase()) fail('bondSink != pinned rehearsal sink');
            if ((fc.bondSink ?? '').toLowerCase() !== PINNED.toLowerCase()) fail('frozenConstants.bondSink != pinned rehearsal sink');
            if (!/^0x[0-9a-f]{40}$/.test(args.template ?? '')) fail('template address malformed');
          } else if (!Array.isArray(kit.decoded.constructorArgs) || kit.decoded.constructorArgs.length !== 0) {
            fail('template stage must have empty constructorArgs');
          }

          const attempt = Number(need('C_ATTEMPT'));
          const ceremonyId = `s2:${chain}:${tag}:${stage}` + (attempt > 1 ? `:attempt${attempt}` : '');
          const payload = {
            ceremonyId,
            claim: 'TESTNET',
            releaseTag: tag,
            chain: { chainId: CHAIN_IDS[chain], name: chain, rpc: RPCS[chain] },
            pinnedSender: PINNED,
            expectedNonce: need('C_NONCE'),
            predictedAddress: {
              address: need('C_PREDICTED'),
              basis: 'rlp(sender, expectedNonce)',
              advisory: true,
            },
            tx: { kind: kit.kind, to: kit.to, value: kit.value, data: kit.data },
            calldataKeccak: kit.calldataKeccak,
            decoded: kit.decoded,
            ...(kit.frozenConstants ? { frozenConstants: kit.frozenConstants } : {}),
            ...(kit.enrichment ? { enrichment: kit.enrichment } : {}),
            provenance: {
              releaseTag: tag,
              commitSha: need('C_TAG_SHA'),
              toolingCommit: need('C_TOOLING_COMMIT'),
              emitter: need('C_EMITTER_META'),
              enrichment: need('C_ENRICHMENT_META'),
              tagJsonSha256: need('C_TAG_JSON_SHA256'),
              enrichedKitJsonSha256: need('C_ENRICHED_KIT_SHA256'),
              foundry: 'v1.7.1',
              solc: '0.8.24',
              generatedAt: new Date().toISOString(),
            },
          };

          const out = need('C_OUT');
          mkdirSync(dirname(out), { recursive: true });
          writeFileSync(out, JSON.stringify(payload, null, 2) + '\n');
          console.log(`[ceremony] wrote ${out}`);
          console.log(`[ceremony] calldataKeccak ${kit.calldataKeccak}`);
          EOF

          SUFFIX=""
          if [ "$ATTEMPT" -gt 1 ]; then SUFFIX="-attempt$ATTEMPT"; fi
          PAYLOAD="contracts/deployments/ceremony/${IN_CHAIN}-${IN_RELEASE_TAG}-${IN_STAGE}${SUFFIX}.ceremony.json"

          C_STAGE="$IN_STAGE" C_CHAIN="$IN_CHAIN" C_TAG="$IN_RELEASE_TAG" \
          C_KIT_JSON="$KIT_JSON" C_NONCE="$EXPECTED_NONCE" C_PREDICTED="$PREDICTED_ADDRESS" \
          C_ATTEMPT="$ATTEMPT" C_TAG_SHA="$TAG_SHA" C_TOOLING_COMMIT="$TOOLING_COMMIT" \
          C_EMITTER_META="$EMITTER_META" C_ENRICHMENT_META="$ENRICHMENT_META" \
          C_TAG_JSON_SHA256="$TAG_JSON_SHA256" C_ENRICHED_KIT_SHA256="$ENRICHED_KIT_SHA256" \
          C_OUT="$PAYLOAD" node /tmp/ceremony-assemble.mjs

          echo "PAYLOAD=$PAYLOAD" >> "$GITHUB_ENV"
          echo "CEREMONY_ID=s2:${IN_CHAIN}:${IN_RELEASE_TAG}:${IN_STAGE}$([ "$ATTEMPT" -gt 1 ] && echo ":attempt${ATTEMPT}" || true)" >> "$GITHUB_ENV"

      # Official channel: commit the payload on a dedicated ceremony branch
      # (never force-pushed, never overwritten). If the branch already
      # exists (earlier attempt), base on it so every attempt stays visible
      # — re-issue after an abort is a NEW file, never an overwrite.
      # Lifecycle rule (Main sign-off 2026-08-17): after the ceremony
      # completes, this branch MUST be merged back to main — the payload
      # belongs on main as the permanent audit trail and the reviewer
      # byte-diff source (§6).
      - name: Commit payload to ceremony branch
        run: |
          set -euo pipefail
          BRANCH="ceremony/${IN_CHAIN}-${IN_RELEASE_TAG}-${IN_STAGE}"
          echo "CEREMONY_BRANCH=$BRANCH" >> "$GITHUB_ENV"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -b "$BRANCH" "origin/$BRANCH"
            if [ -e "$PAYLOAD" ]; then
              echo "payload file already exists on $BRANCH — a re-issue needs a NEW attempt number (never overwrite)."
              exit 1
            fi
          else
            git checkout -b "$BRANCH"
          fi

          git add "$PAYLOAD"
          git commit -m "ceremony(${CEREMONY_ID}): commit payload for signing (pre-sign publication, P1)"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "payload committed to branch $BRANCH"

      - name: Publish calldataKeccak (P1 — before any signing)
        run: |
          set -euo pipefail
          KECCAK=$(jq -r '.calldataKeccak' "$PAYLOAD")
          {
            echo "## S3 ceremony payload — ${CEREMONY_ID}"
            echo ""
            echo "- releaseTag: \`${IN_RELEASE_TAG}\` (commit ${TAG_SHA})"
            echo "- toolingCommit: \`${TOOLING_COMMIT}\` (recorded separately, #96 §10.1)"
            echo "- chain: ${IN_CHAIN} (chainId ${CHAIN_ID}) — claim TESTNET (P7)"
            echo "- stage: ${IN_STAGE} | attempt: ${ATTEMPT} | expectedNonce: ${EXPECTED_NONCE} (advisory, P6)"
            echo "- predicted address: ${PREDICTED_ADDRESS} (ADVISORY — plain CREATE; receipt is truth)"
            echo "- payload: \`${PAYLOAD}\` on branch \`${CEREMONY_BRANCH}\`"
            echo ""
            echo "**calldataKeccak (published BEFORE signing — P1):** \`${KECCAK}\`"
            echo ""
            echo "Next (manual, sole signing step): operator pulls the payload from the branch,"
            echo "runs the offline verifier + byte-diff checklist (§6), signs and broadcasts from"
            echo "their own wallet, then dispatches action=verify with the reported tx hash."
            echo ""
            echo "**Lifecycle rule:** after the ceremony completes, branch \`${CEREMONY_BRANCH}\` MUST be"
            echo "merged back to main — permanent audit trail + reviewer byte-diff source."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ceremony payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ceremony-payload-${{ env.IN_CHAIN }}-${{ env.IN_STAGE }}
          path: ${{ env.PAYLOAD }}
          if-no-files-found: error

  # Ref-shape gate for verify: payload_ref reaches `checkout ref:` ONLY
  # after passing here (Review54 #104 hardening). Everything is validated
  # as data, in bash, before any checkout of an operator-named ref.
  validate-verify-inputs:
    if: ${{ github.event.inputs.action == 'verify' || github.event.inputs.action == 'g4-readback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IN_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
      IN_CHAIN: ${{ github.event.inputs.chain }}
      IN_STAGE: ${{ github.event.inputs.stage }}
      IN_ATTEMPT: ${{ github.event.inputs.attempt }}
      IN_DEPLOY_TX_HASH: ${{ github.event.inputs.deploy_tx_hash }}
      IN_PAYLOAD_REF: ${{ github.event.inputs.payload_ref }}
    steps:
      - name: Validate all verify inputs (fail-closed, before checkout)
        run: |
          set -euo pipefail

          case "$IN_CHAIN" in
            base-sepolia|robinhood-46630) ;;
            *) echo "unknown chain: $IN_CHAIN"; exit 1 ;;
          esac

          case "$IN_STAGE" in
            template|factory) ;;
            *) echo "unknown stage: $IN_STAGE"; exit 1 ;;
          esac

          case "$IN_RELEASE_TAG" in
            contracts-v*) ;;
            *) echo "release tag must look like contracts-v* (got: $IN_RELEASE_TAG)"; exit 1 ;;
          esac

          if ! [[ "$IN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "attempt must be a positive integer (got: $IN_ATTEMPT)"
            exit 1
          fi

          if ! [[ "$IN_DEPLOY_TX_HASH" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "deploy_tx_hash must be 0x + 64 hex chars (got: $IN_DEPLOY_TX_HASH)"
            exit 1
          fi

          # Ref-shaped: branch/tag name or full refs/ path or 40-hex sha.
          # Conservative charset, bounded length, no path traversal.
          if [ -z "$IN_PAYLOAD_REF" ]; then
            echo "verify requires payload_ref (the ref carrying the committed ceremony payload)."
            exit 1
          fi
          if [ "${#IN_PAYLOAD_REF}" -gt 200 ]; then
            echo "payload_ref longer than 200 chars — rejected."
            exit 1
          fi
          if ! [[ "$IN_PAYLOAD_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "payload_ref carries characters outside [A-Za-z0-9._/-] — rejected."
            exit 1
          fi
          case "/$IN_PAYLOAD_REF/" in
            */../*|*/./*|*//*) echo "payload_ref contains a path-traversal pattern — rejected."; exit 1 ;;
          esac
          case "$IN_PAYLOAD_REF" in
            *.lock) echo "payload_ref ends in .lock (forbidden ref shape) — rejected."; exit 1 ;;
          esac
          case "$IN_PAYLOAD_REF" in
            -*) echo "payload_ref starts with '-' — rejected."; exit 1 ;;
          esac

          echo "all verify inputs valid — chain=$IN_CHAIN stage=$IN_STAGE tag=$IN_RELEASE_TAG attempt=$IN_ATTEMPT ref=$IN_PAYLOAD_REF"

  verify:
    if: ${{ github.event.inputs.action == 'verify' }}
    needs: validate-verify-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IN_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
      IN_CHAIN: ${{ github.event.inputs.chain }}
      IN_STAGE: ${{ github.event.inputs.stage }}
      IN_ATTEMPT: ${{ github.event.inputs.attempt }}
      IN_DEPLOY_TX_HASH: ${{ github.event.inputs.deploy_tx_hash }}
      IN_PAYLOAD_REF: ${{ github.event.inputs.payload_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Shape-validated in the validate-verify-inputs job above.
          ref: ${{ github.event.inputs.payload_ref }}

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # Post-broadcast backstop (scoped Main subset of §8). Single JSON-RPC
      # calls only — Robinhood RPC rejects batch arrays with 403 (#98).
      # The full g4-readback (code identity, immutable readbacks,
      # transcript) is a separate job.
      - name: Post-broadcast checks (P3 hash-compare, P4 sender pin, P6 nonce, status)
        run: |
          set -euo pipefail
          CHAIN="$IN_CHAIN"
          STAGE="$IN_STAGE"
          TAG="$IN_RELEASE_TAG"
          AT="$IN_ATTEMPT"
          TX="$IN_DEPLOY_TX_HASH"
          PINNED_SENDER="0x00e7bE21b70DD57bA2AAC3C32657304dDA6863C2"

          case "$CHAIN" in
            base-sepolia)    RPC="https://sepolia.base.org" ;;
            robinhood-46630) RPC="https://rpc.testnet.chain.robinhood.com" ;;
            *) echo "unknown chain: $CHAIN"; exit 1 ;;
          esac

          SUFFIX=""
          if [ "$AT" != "1" ]; then SUFFIX="-attempt$AT"; fi
          PAYLOAD="contracts/deployments/ceremony/${CHAIN}-${TAG}-${STAGE}${SUFFIX}.ceremony.json"
          if [ ! -s "$PAYLOAD" ]; then
            echo "committed payload not found at $PAYLOAD on this ref — fail closed."
            exit 1
          fi

          PUB_KECCAK=$(jq -r '.calldataKeccak' "$PAYLOAD")
          PUB_SENDER=$(jq -r '.pinnedSender' "$PAYLOAD")
          PUB_NONCE=$(jq -r '.expectedNonce' "$PAYLOAD")
          if [ "${PUB_SENDER,,}" != "${PINNED_SENDER,,}" ]; then
            echo "payload pinnedSender != rehearsal pin — fail closed."
            exit 1
          fi

          TXRESP=$(curl -sS -m 30 -X POST "$RPC" -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_getTransactionByHash","params":["'"$TX"'"]}')
          RCRESP=$(curl -sS -m 30 -X POST "$RPC" -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"eth_getTransactionReceipt","params":["'"$TX"'"]}')

          INPUT=$(printf '%s' "$TXRESP" | jq -r '.result.input // empty')
          TX_NONCE=$(printf '%s' "$TXRESP" | jq -r '.result.nonce // empty')
          FROM=$(printf '%s' "$RCRESP" | jq -r '.result.from // empty')
          STATUS=$(printf '%s' "$RCRESP" | jq -r '.result.status // empty')

          if [ -z "$INPUT" ] || [ -z "$FROM" ]; then
            echo "tx $TX not found on $CHAIN — wrong chain, or not yet broadcast/confirmed."
            exit 1
          fi

          ACTUAL_KECCAK=$(cast keccak "$INPUT")
          VERDICT=0
          check() {
            if [ "$2" = "$3" ]; then
              echo "PASS  $1: $2"
            else
              echo "REJECT $1: expected $2, got $3"
              VERDICT=1
            fi
          }
          echo "post-broadcast checks for $TX on $CHAIN (chainId-scoped claim, P7):"
          check "P3 keccak256(tx.input) == published calldataKeccak" "${PUB_KECCAK,,}" "${ACTUAL_KECCAK,,}"
          check "P4 receipt.from == pinnedSender" "${PUB_SENDER,,}" "${FROM,,}"
          check "P6 tx.nonce == expectedNonce" "${PUB_NONCE,,}" "${TX_NONCE,,}"
          check "receipt.status == success" "0x1" "${STATUS,,}"

          if [ "$VERDICT" -ne 0 ]; then
            echo "VERDICT: REJECT — what hit the chain does NOT match the published ceremony payload."
            exit 1
          fi
          echo "VERDICT: PASS — on-chain bytes match the published payload (this chain only)."

  # FULL §8 gate (g4-readback) — ordered checks, any failure = REJECT:
  #   1 P3 keccak256(tx.input) == payload.calldataKeccak
  #   2 P4 receipt.from == pinnedSender
  #   3 P6 tx.nonce == expectedNonce; nonce matched but address differs
  #     from the advisory prediction => structural REJECT (§8 item 3)
  #   4 receipt.status success + contractAddress present
  #   5 CODE IDENTITY: keccak256(eth_getCode(addr)) vs the runtime of an
  #     at-tag recompile. Factory immutables are zero-masked on BOTH sides
  #     — their VALUES are verified by check 6 readbacks, never trusted
  #     from the hash. Template has no immutables (direct compare).
  #   6 immutable readbacks (factory only): template() / totalFeeBps() /
  #     bondAmount() / bondSink() == payload decoded values
  #   7 TRANSCRIPT: every read recorded with provenance (RPC URL, block
  #     number, tx hash, timestamp) and uploaded as an artifact —
  #     evidence for the Tier D claims (frozen vocabulary, P7 stamp).
  # All RPC traffic is single JSON-RPC calls (Robinhood batch-403, #98).
  g4-readback:
    if: ${{ github.event.inputs.action == 'g4-readback' }}
    needs: validate-verify-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IN_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
      IN_CHAIN: ${{ github.event.inputs.chain }}
      IN_STAGE: ${{ github.event.inputs.stage }}
      IN_ATTEMPT: ${{ github.event.inputs.attempt }}
      IN_DEPLOY_TX_HASH: ${{ github.event.inputs.deploy_tx_hash }}
      IN_PAYLOAD_REF: ${{ github.event.inputs.payload_ref }}
      TOOLING_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Shape-validated in the validate-verify-inputs job.
          ref: ${{ github.event.inputs.payload_ref }}
          path: payload-ws

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          ref: refs/tags/${{ github.event.inputs.release_tag }}
          path: tag-ws

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # The code-identity step recompiles at the tag (`forge build`).
      # Foundry would auto-download solc there, but pinning the install to a
      # cached, explicit step keeps the gate deterministic and fast; same
      # fix as the prepare job (S3 attempt-1 offline-solc failure).
      - name: Cache solc 0.8.24 (~/.svm)
        uses: actions/cache@v4
        with:
          path: ~/.svm
          key: ${{ runner.os }}-solc-0.8.24

      - name: Ensure solc 0.8.24 is present before at-tag recompile
        working-directory: tag-ws/contracts
        run: |
          set -euo pipefail
          if ! ls "$HOME/.svm/0.8.24/"solc-* >/dev/null 2>&1; then
            echo "solc 0.8.24 not in svm cache — warming with one online build"
            forge build --skip test --skip script
          fi
          ls "$HOME/.svm/0.8.24/"solc-*

      - name: Collect on-chain evidence (single JSON-RPC calls only)
        run: |
          set -euo pipefail
          case "$IN_CHAIN" in
            base-sepolia)    RPC="https://sepolia.base.org" ;;
            robinhood-46630) RPC="https://rpc.testnet.chain.robinhood.com" ;;
            *) echo "unknown chain: $IN_CHAIN"; exit 1 ;;
          esac
          echo "RPC=$RPC" >> "$GITHUB_ENV"
          echo "VERDICT=0" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/checks.jsonl"

          SUFFIX=""
          if [ "$IN_ATTEMPT" != "1" ]; then SUFFIX="-attempt$IN_ATTEMPT"; fi
          PAYLOAD="payload-ws/contracts/deployments/ceremony/${IN_CHAIN}-${IN_RELEASE_TAG}-${IN_STAGE}${SUFFIX}.ceremony.json"
          if [ ! -s "$PAYLOAD" ]; then
            echo "committed payload not found at $PAYLOAD on ref $IN_PAYLOAD_REF — fail closed."
            exit 1
          fi
          echo "PAYLOAD=$PAYLOAD" >> "$GITHUB_ENV"

          TXRESP=$(curl -sS -m 30 -X POST "$RPC" -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_getTransactionByHash","params":["'"$IN_DEPLOY_TX_HASH"'"]}')
          RCRESP=$(curl -sS -m 30 -X POST "$RPC" -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"eth_getTransactionReceipt","params":["'"$IN_DEPLOY_TX_HASH"'"]}')

          INPUT=$(printf '%s' "$TXRESP" | jq -r '.result.input // empty')
          TX_NONCE=$(printf '%s' "$TXRESP" | jq -r '.result.nonce // empty')
          FROM=$(printf '%s' "$RCRESP" | jq -r '.result.from // empty')
          STATUS=$(printf '%s' "$RCRESP" | jq -r '.result.status // empty')
          CONTRACT_ADDR=$(printf '%s' "$RCRESP" | jq -r '.result.contractAddress // empty')
          BLOCK_NUMBER=$(printf '%s' "$RCRESP" | jq -r '.result.blockNumber // empty')

          if [ -z "$INPUT" ] || [ -z "$FROM" ] || [ -z "$CONTRACT_ADDR" ]; then
            echo "tx $IN_DEPLOY_TX_HASH not found / not mined on $IN_CHAIN — wrong chain, or not yet broadcast/confirmed."
            exit 1
          fi

          CODERESP=$(curl -sS -m 30 -X POST "$RPC" -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":3,"method":"eth_getCode","params":["'"$CONTRACT_ADDR"'","latest"]}')
          CHAIN_CODE=$(printf '%s' "$CODERESP" | jq -r '.result // empty')
          if [ -z "$CHAIN_CODE" ] || [ "$CHAIN_CODE" = "0x" ]; then
            echo "no code at $CONTRACT_ADDR — fail closed."
            exit 1
          fi

          {
            echo "INPUT=$INPUT"
            echo "TX_NONCE=$TX_NONCE"
            echo "FROM=$FROM"
            echo "STATUS=$STATUS"
            echo "CONTRACT_ADDR=$CONTRACT_ADDR"
            echo "BLOCK_NUMBER=$BLOCK_NUMBER"
          } >> "$GITHUB_ENV"
          printf '%s' "$CHAIN_CODE" > "$RUNNER_TEMP/chain-code.hex"
          echo "evidence collected — contract $CONTRACT_ADDR at block $BLOCK_NUMBER"

      - name: Checks 1–4 (P3, P4, P6, status + predicted-address structural check)
        run: |
          set -euo pipefail
          PUB_KECCAK=$(jq -r '.calldataKeccak' "$PAYLOAD")
          PUB_SENDER=$(jq -r '.pinnedSender' "$PAYLOAD")
          PUB_NONCE=$(jq -r '.expectedNonce' "$PAYLOAD")
          PRED_ADDR=$(jq -r '.predictedAddress.address // empty' "$PAYLOAD")

          record() { # name expected actual pass(1|0)
            jq -n --arg name "$1" --arg expected "$2" --arg actual "$3" --argjson pass "$4" \
              '{name:$name, expected:$expected, actual:$actual, pass:($pass==1)}' >> "$RUNNER_TEMP/checks.jsonl"
            if [ "$4" -ne 1 ]; then
              echo "VERDICT=1" >> "$GITHUB_ENV"
              echo "REJECT $1: expected $2, got $3"
            else
              echo "PASS  $1: $2"
            fi
          }

          ACTUAL_KECCAK=$(cast keccak "$INPUT")
          record "P3 keccak256(tx.input) == calldataKeccak" "${PUB_KECCAK,,}" "${ACTUAL_KECCAK,,}" "$([ "${PUB_KECCAK,,}" = "${ACTUAL_KECCAK,,}" ] && echo 1 || echo 0)"
          record "P4 receipt.from == pinnedSender" "${PUB_SENDER,,}" "${FROM,,}" "$([ "${PUB_SENDER,,}" = "${FROM,,}" ] && echo 1 || echo 0)"
          record "P6 tx.nonce == expectedNonce" "${PUB_NONCE,,}" "${TX_NONCE,,}" "$([ "${PUB_NONCE,,}" = "${TX_NONCE,,}" ] && echo 1 || echo 0)"
          record "receipt.status == success" "0x1" "${STATUS,,}" "$([ "${STATUS,,}" = "0x1" ] && echo 1 || echo 0)"

          # §8 item 3: nonce matched but the deployed address differs from
          # the advisory prediction => something structurally wrong.
          if [ -n "$PRED_ADDR" ]; then
            record "predictedAddress (advisory) == contractAddress" "${PRED_ADDR,,}" "${CONTRACT_ADDR,,}" "$([ "${PRED_ADDR,,}" = "${CONTRACT_ADDR,,}" ] && echo 1 || echo 0)"
          fi
          echo "checks 1–4 recorded"

      - name: Recompile at the tag (code-identity basis)
        run: |
          set -euo pipefail
          cd tag-ws/contracts
          forge build
          echo "TAG_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ "$IN_STAGE" = "template" ]; then
            echo "ARTIFACT=tag-ws/contracts/out/TokenTemplate.sol/KryptrLaunchTokenTemplate.json" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT=tag-ws/contracts/out/TokenFactory.sol/KryptrTokenFactory.json" >> "$GITHUB_ENV"
          fi

      - name: Check 5 — code identity (immutable regions zero-masked on both sides)
        run: |
          set -euo pipefail
          cat > /tmp/mask-runtime.mjs <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';

          const [artifactPath, chainCodePath, outDir] = process.argv.slice(2);
          const art = JSON.parse(readFileSync(artifactPath, 'utf8'));
          let obj = art.deployedBytecode?.object ?? '';
          if (obj.startsWith('0x')) obj = obj.slice(2);
          if (!/^[0-9a-f]+$/i.test(obj)) {
            console.error('artifact deployedBytecode.object malformed — fail closed');
            process.exit(1);
          }
          const local = Buffer.from(obj, 'hex');

          const refs = art.deployedBytecode?.immutableReferences ?? {};
          const regions = Object.values(refs).flat();

          let chainHex = readFileSync(chainCodePath, 'utf8').trim();
          if (chainHex.startsWith('0x')) chainHex = chainHex.slice(2);
          if (!/^[0-9a-f]+$/i.test(chainHex)) {
            console.error('chain code malformed — fail closed');
            process.exit(1);
          }
          const chain = Buffer.from(chainHex, 'hex');

          if (chain.length !== local.length) {
            console.error(`runtime length mismatch: chain ${chain.length} != tag-artifact ${local.length} — fail closed`);
            process.exit(1);
          }
          for (const r of regions) {
            if (!Number.isInteger(r.start) || !Number.isInteger(r.length) || r.start + r.length > local.length) {
              console.error('immutableReference region outside bytecode — fail closed');
              process.exit(1);
            }
            local.fill(0, r.start, r.start + r.length);
            chain.fill(0, r.start, r.start + r.length);
          }
          writeFileSync(`${outDir}/masked-local.hex`, local.toString('hex'));
          writeFileSync(`${outDir}/masked-chain.hex`, chain.toString('hex'));
          console.log(`masked ${regions.length} immutable region(s); runtime ${local.length} bytes`);
          EOF

          OUTDIR="$RUNNER_TEMP/g4"
          mkdir -p "$OUTDIR"
          node /tmp/mask-runtime.mjs "$ARTIFACT" "$RUNNER_TEMP/chain-code.hex" "$OUTDIR"

          HASH_LOCAL=$(cast keccak "0x$(cat "$OUTDIR/masked-local.hex")")
          HASH_CHAIN=$(cast keccak "0x$(cat "$OUTDIR/masked-chain.hex")")
          PASS=$([ "${HASH_LOCAL,,}" = "${HASH_CHAIN,,}" ] && echo 1 || echo 0)
          jq -n --arg name "code identity: keccak(masked on-chain runtime) == keccak(masked at-tag runtime)" \
            --arg expected "$HASH_LOCAL" --arg actual "$HASH_CHAIN" --argjson pass "$PASS" \
            '{name:$name, expected:$expected, actual:$actual, pass:($pass==1)}' >> "$RUNNER_TEMP/checks.jsonl"
          if [ "$PASS" -ne 1 ]; then
            echo "VERDICT=1" >> "$GITHUB_ENV"
            echo "REJECT code identity: $HASH_CHAIN != $HASH_LOCAL"
          else
            echo "PASS  code identity: $HASH_LOCAL"
          fi

      - name: Check 6 — immutable readbacks (factory stage only)
        run: |
          set -euo pipefail
          export ETH_RPC_URL="$RPC" # cast call needs an explicit RPC — it does NOT read $RPC (#106 Review54 HIGH)
          if [ "$IN_STAGE" = "template" ]; then
            echo "template stage has no readback surface (§8 item 6) — readback = code identity only."
            exit 0
          fi

          record() { # name expected actual pass(1|0)
            jq -n --arg name "$1" --arg expected "$2" --arg actual "$3" --argjson pass "$4" \
              '{name:$name, expected:$expected, actual:$actual, pass:($pass==1)}' >> "$RUNNER_TEMP/checks.jsonl"
            if [ "$4" -ne 1 ]; then
              echo "VERDICT=1" >> "$GITHUB_ENV"
              echo "REJECT $1: expected $2, got $3"
            else
              echo "PASS  $1: $2"
            fi
          }

          EXP_TEMPLATE=$(jq -r '.decoded.constructorArgs.template' "$PAYLOAD")
          EXP_FEE=$(jq -r '.decoded.constructorArgs.totalFeeBps' "$PAYLOAD")
          EXP_BOND=$(jq -r '.decoded.constructorArgs.bondAmountWei' "$PAYLOAD")
          EXP_SINK=$(jq -r '.decoded.constructorArgs.bondSink' "$PAYLOAD")

          RB_TEMPLATE=$(cast call "$CONTRACT_ADDR" "template()" | tr -d '[:space:]')
          RB_FEE=$(cast call "$CONTRACT_ADDR" "totalFeeBps()" | tr -d '[:space:]')
          RB_BOND=$(cast call "$CONTRACT_ADDR" "bondAmount()" | tr -d '[:space:]')
          RB_SINK=$(cast call "$CONTRACT_ADDR" "bondSink()" | tr -d '[:space:]')

          GOT_TEMPLATE="0x${RB_TEMPLATE: -40}"
          GOT_FEE=$((16#${RB_FEE#0x}))
          GOT_BOND=$((16#${RB_BOND#0x}))
          GOT_SINK="0x${RB_SINK: -40}"

          record "readback template() == decoded template" "${EXP_TEMPLATE,,}" "${GOT_TEMPLATE,,}" "$([ "${EXP_TEMPLATE,,}" = "${GOT_TEMPLATE,,}" ] && echo 1 || echo 0)"
          record "readback totalFeeBps() == decoded totalFeeBps" "$EXP_FEE" "$GOT_FEE" "$([ "$EXP_FEE" = "$GOT_FEE" ] && echo 1 || echo 0)"
          record "readback bondAmount() == decoded bondAmountWei" "$EXP_BOND" "$GOT_BOND" "$([ "$EXP_BOND" = "$GOT_BOND" ] && echo 1 || echo 0)"
          record "readback bondSink() == decoded bondSink" "${EXP_SINK,,}" "${GOT_SINK,,}" "$([ "${EXP_SINK,,}" = "${GOT_SINK,,}" ] && echo 1 || echo 0)"

      - name: Check 7 — transcript with provenance (artifact)
        run: |
          set -euo pipefail
          CEREMONY_ID=$(jq -r '.ceremonyId' "$PAYLOAD")
          CHAIN_ID=$(jq -r '.chain.chainId' "$PAYLOAD")
          if [ "$VERDICT" -eq 0 ]; then FINAL="PASS"; else FINAL="REJECT"; fi

          TRANSCRIPT="$RUNNER_TEMP/g4-transcript-${IN_CHAIN}-${IN_STAGE}.json"
          jq -s \
            --arg ceremonyId "$CEREMONY_ID" \
            --arg chain "$IN_CHAIN" \
            --argjson chainId "$CHAIN_ID" \
            --arg stage "$IN_STAGE" \
            --arg tx "$IN_DEPLOY_TX_HASH" \
            --arg contract "$CONTRACT_ADDR" \
            --arg verdict "$FINAL" \
            --arg rpc "$RPC" \
            --arg block "$BLOCK_NUMBER" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg releaseTag "$IN_RELEASE_TAG" \
            --arg commitSha "$TAG_SHA" \
            --arg toolingCommit "$TOOLING_COMMIT" \
            '{
              ceremonyId: $ceremonyId,
              claim: "TESTNET",
              chain: { chainId: $chainId, name: $chain },
              stage: $stage,
              deployTxHash: $tx,
              contractAddress: $contract,
              verdict: $verdict,
              readbackAt: $at,
              provenance: {
                rpc: $rpc,
                blockNumber: $block,
                releaseTag: $releaseTag,
                commitSha: $commitSha,
                toolingCommit: $toolingCommit,
              },
              checks: .,
            }' "$RUNNER_TEMP/checks.jsonl" > "$TRANSCRIPT"

          echo "TRANSCRIPT=$TRANSCRIPT" >> "$GITHUB_ENV"
          cat "$TRANSCRIPT"
          {
            echo "## g4-readback — ${CEREMONY_ID}"
            echo ""
            echo "- verdict: **${FINAL}** (claim TESTNET, chainId ${CHAIN_ID} — P7)"
            echo "- contract: \`${CONTRACT_ADDR}\` | block ${BLOCK_NUMBER} | tx \`${IN_DEPLOY_TX_HASH}\`"
            echo "- transcript artifact: g4-transcript-${IN_CHAIN}-${IN_STAGE}"
            if [ "$FINAL" = "REJECT" ]; then
              echo ""
              echo "REJECT severs the chain to the Tier D battery — no battery, no artifact."
              echo "A new attempt = a new ceremony dispatch, explicitly (no silent retries)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$VERDICT" -ne 0 ]; then
            echo "VERDICT: REJECT — full §8 readback failed."
            exit 1
          fi
          echo "VERDICT: PASS — full §8 readback green (this chain only; TESTNET PASS != MAINNET PASS)."

      - name: Upload g4 transcript
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: g4-transcript-${{ env.IN_CHAIN }}-${{ env.IN_STAGE }}
          path: ${{ env.TRANSCRIPT }}
          if-no-files-found: warn
