name: Nightly live

# Advisory live signal, never a required check. Runs keyed adapter suites
# (0x, CoinGecko) when the user-owned secrets exist, test:live (public
# Base RPC, no keys) always, and the contracts fork tests (public Base
# RPC) — so every run contributes regression signal.
#
# Secrets policy: keys live in GitHub Actions repo settings under the
# canonical names below; they are NEVER committed to this repo. Without
# them, env-gate skips keyed suites with a logged reason and the run stays
# green (skip ≠ failure; forks are safe).
#
# Cron caveats: schedules run from the DEFAULT branch only, in UTC, with
# possible GitHub-side delays; scheduled workflows auto-disable after 60
# days of repo inactivity (re-enable from the Actions tab).

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Keyed adapter suites (graceful skip without secrets)
        run: npx nx run-many -t test
        env:
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      # test:live is keyless (public Base RPC) — always contributes signal.
      # Target name has a colon: invoke as `nx test:live api`, never
      # `nx run api:test:live` (that parses as target=test config=live).
      - name: Live Base RPC reads (no keys needed)
        run: npx nx test:live api

  # Contracts fork tests against real Base RPC (keyless). Recurring signal
  # lives here (plus the opt-in `fork-tests` PR label in ci.yml) — real-RPC
  # flakiness never gates default CI.
  fork-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Contracts fork tests (public Base RPC, keyless)
        run: npx nx run @kryptr/contracts:fork-test
        env:
          RPC_URL_BASE: https://mainnet.base.org
