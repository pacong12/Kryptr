name: Release-tag battery

# Wave-5 close / release gate (wave5-release-tag-battery-runbook.md):
# dispatch at a named contracts-v* tag -> run the Tier-F battery as
# PARALLEL jobs, then INDEPENDENTLY re-derive every G5 artifact's
# contentHash (never trust the producer's recorded hash — runbook §7).
#
# Parallel split (Main ruling): GitHub-hosted jobs hard-cap at 360
# minutes, and the four deep invariant campaigns (2048 x 512, super-
# linear in depth) exceed that in a single sequential g1 run. One job
# per campaign (battery-g1-campaign target) keeps every job far under
# the cap, drops wall-clock to the slowest campaign, and a
# counterexample in one campaign no longer buries the others' evidence.
#
# Two SEPARATE gates, never conflated (VaultAPI review):
#   - the five evidence jobs — Tier F PASS. Always required.
#   - job `verify-g5` — G5 artifact presence + hash verification.
#     G5 assembly itself is a runbook §7 step carried over to wave 6
#     (Main ruling), so the wave-5 closing tag legitimately has NO
#     artifacts. `expect_artifacts` defaults TRUE (fail-closed for every
#     future launch tag); the wave-5 closing run sets it false EXPLICITLY
#     — an auditable one-time opt-out, never a silent skip. Artifacts
#     that DO exist are always verified, in both modes.
#
# Dispatch-only by design: the opt-out is an input, so an automatic
# tag-push trigger could never carry it. The operator cuts the tag AND
# explicitly dispatches at it — two deliberate, audited acts (keyless).
# Deploy is NOT part of this workflow: factory stays dark until wave 6.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to run the battery at (e.g. contracts-v0.1.0)'
        required: true
        type: string
      expect_artifacts:
        description: 'Require G5 verification artifacts (fail-closed). Wave-5 closing only: set false explicitly.'
        required: true
        type: boolean
        default: true
      fork_block_base:
        description: 'Optional Base mainnet fork block pin. Empty = latest.'
        required: false
        default: ''
        type: string
      fork_block_base_sepolia:
        description: 'Optional Base Sepolia fork block pin (rehearsal B_fork). Empty = latest.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  g1-bondledger:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          ref: refs/tags/${{ github.event.inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: G1 deep invariant — bondLedger reconciles with sink
        run: |
          set -euo pipefail
          # Tag compat: battery-g1-campaign exists only from #92 onward, but
          # workflow_dispatch takes THIS file from main while the code is
          # checked out at the tag. Resolve from the tag's own project.json;
          # pre-#92 tags fall back to the equivalent direct forge command
          # (same per-campaign isolation, no nx naming dependency).
          if jq -e '.targets["battery-g1-campaign"]' contracts/project.json >/dev/null 2>&1; then
            npx nx run @kryptr/contracts:battery-g1-campaign
          else
            echo "tag predates battery-g1-campaign (#92) — running campaign via forge directly"
            cd contracts
            FOUNDRY_PROFILE=battery forge test --match-test "$INVARIANT_CAMPAIGN" -vv
          fi
        env:
          INVARIANT_CAMPAIGN: invariant_bondLedger_reconcilesWithSink

  g1-bondparams:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          ref: refs/tags/${{ github.event.inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: G1 deep invariant — bondParams immutable
        run: |
          set -euo pipefail
          if jq -e '.targets["battery-g1-campaign"]' contracts/project.json >/dev/null 2>&1; then
            npx nx run @kryptr/contracts:battery-g1-campaign
          else
            echo "tag predates battery-g1-campaign (#92) — running campaign via forge directly"
            cd contracts
            FOUNDRY_PROFILE=battery forge test --match-test "$INVARIANT_CAMPAIGN" -vv
          fi
        env:
          INVARIANT_CAMPAIGN: invariant_bondParams_immutable

  g1-supplyfrozen:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          ref: refs/tags/${{ github.event.inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: G1 deep invariant — clones supply and schedule frozen
        run: |
          set -euo pipefail
          if jq -e '.targets["battery-g1-campaign"]' contracts/project.json >/dev/null 2>&1; then
            npx nx run @kryptr/contracts:battery-g1-campaign
          else
            echo "tag predates battery-g1-campaign (#92) — running campaign via forge directly"
            cd contracts
            FOUNDRY_PROFILE=battery forge test --match-test "$INVARIANT_CAMPAIGN" -vv
          fi
        env:
          INVARIANT_CAMPAIGN: invariant_clones_supplyAndScheduleFrozen

  g1-neverreinit:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          ref: refs/tags/${{ github.event.inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: G1 deep invariant — clones never reinitializable
        run: |
          set -euo pipefail
          if jq -e '.targets["battery-g1-campaign"]' contracts/project.json >/dev/null 2>&1; then
            npx nx run @kryptr/contracts:battery-g1-campaign
          else
            echo "tag predates battery-g1-campaign (#92) — running campaign via forge directly"
            cd contracts
            FOUNDRY_PROFILE=battery forge test --match-test "$INVARIANT_CAMPAIGN" -vv
          fi
        env:
          INVARIANT_CAMPAIGN: invariant_clones_neverReinitializable

  fast-legs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          ref: refs/tags/${{ github.event.inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install Slither
        run: python3 -m pip install --user slither-analyzer==0.11.6
      - name: G1 unit suite (default profile)
        run: npx nx run @kryptr/contracts:forge-test
      - name: G2 slither + never-triage guard + selector surface
        run: npx nx run @kryptr/contracts:battery-g2
      - name: G3 keyless Base Sepolia fork (unit-only, 429 ruling)
        run: npx nx run @kryptr/contracts:battery-g3
        env:
          RPC_URL_BASE_SEPOLIA: https://sepolia.base.org
          FORK_BLOCK_BASE_SEPOLIA: ${{ github.event.inputs.fork_block_base_sepolia || vars.FORK_BLOCK_BASE_SEPOLIA }}

  verify-g5:
    needs:
      - g1-bondledger
      - g1-bondparams
      - g1-supplyfrozen
      - g1-neverreinit
      - fast-legs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          ref: refs/tags/${{ github.event.inputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Independent re-canonicalization (Web3Intel rule): strip each
      # artifact's contentHash, canonicalize per the pinned in-repo RFC
      # 8785 tool, sha256, compare. Any mismatch fails the release.
      # Presence requirement is separate from verification: existing
      # artifacts are ALWAYS verified; expect_artifacts only governs
      # whether zero artifacts is allowed.
      - name: Independent contentHash verification
        run: |
          shopt -s nullglob
          artifacts=(contracts/deployments/*.verification.json)
          if [ ${#artifacts[@]} -eq 0 ]; then
            if [ "${{ github.event.inputs.expect_artifacts }}" = "false" ]; then
              echo "No G5 artifacts and expect_artifacts=false — audited one-time opt-out."
              echo "Wave-5 closing: G5 assembly is a wave-6 carry-over (runbook §7)."
              exit 0
            fi
            echo "No G5 verification artifacts and expect_artifacts=true — fail closed."
            exit 1
          fi
          node contracts/tools/verify-content-hash.mjs "${artifacts[@]}"

      - name: Upload G5 artifacts
        if: ${{ hashFiles('contracts/deployments/*.verification.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: g5-release-artifacts
          path: |
            contracts/deployments/*.json
            contracts/deployments/*.verification.json
          if-no-files-found: error
