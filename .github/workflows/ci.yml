name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kryptr
          POSTGRES_PASSWORD: kryptr_dev
          POSTGRES_DB: kryptr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kryptr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://kryptr:kryptr_dev@localhost:5432/kryptr
      DIRECT_URL: postgresql://kryptr:kryptr_dev@localhost:5432/kryptr
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Compute nx base
        id: nx_base
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "base=origin/main" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify HEAD~1 > /dev/null 2>&1; then
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-list --max-parents=0 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - run: npx nx format:check --base="${{ steps.nx_base.outputs.base }}"
        if: github.event_name == 'pull_request'

      - run: npx nx affected --base="${{ steps.nx_base.outputs.base }}" -t build test typecheck lint smoke test-workers --parallel=3

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install Slither
        run: python3 -m pip install --user slither-analyzer==0.11.6

      - name: Compute nx base
        id: nx_base
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "base=origin/main" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-list --max-parents=0 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Contracts gates
        run: npx nx affected --base="${{ steps.nx_base.outputs.base }}" -t forge-build forge-test fmt slither manifests canonicalize

      - name: Venue registry validation
        run: |
          set -euo pipefail
          shopt -s nullglob
          venue_files=(contracts/deployments/venues/*.venues.json)
          if [ ${#venue_files[@]} -eq 0 ]; then
            echo "No venue files found — S4 venue registry not yet deployed (expected). Gate passes."
            exit 0
          fi
          echo "Validating ${#venue_files[@]} venue file(s)..."
          node contracts/tools/validate-venues.mjs "${venue_files[@]}"

  # Wave-6 S4 venue integration testing (Phase 2 Week 1-2):
  # Validates ZeroExVenueAdapter additive fee model, invariant compliance,
  # and two-ledger separation. Fail-closed posture: any invariant violation
  # blocks merge. Runs in CI from day one (no local-only testing).
  #
  # Invariants enforced:
  # - INV-FEE-2: Exact conservation (sum(recipientShares) == baseFeeWei)
  # - INV-FEE-4: Rate identity floor math (venueAccrualWei == floor(tradeAmount × venueBps / 10_000))
  # - INV-VENUE-1: Two-ledger separation (no cross-contamination)
  integration-venue:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kryptr
          POSTGRES_PASSWORD: kryptr_dev
          POSTGRES_DB: kryptr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kryptr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://kryptr:kryptr_dev@localhost:5432/kryptr
      DIRECT_URL: postgresql://kryptr:kryptr_dev@localhost:5432/kryptr
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Venue integration tests (additive fee model + invariants)
        run: |
          set -euo pipefail
          echo "Running ZeroExVenueAdapter integration tests..."
          echo "Invariant compliance: INV-FEE-2, INV-FEE-4, INV-VENUE-1"
          echo "Fail-closed: any violation blocks merge"
          npx nx run @kryptr/api:test --testPathPattern=zero-ex-venue

      - name: Invariant assertion hooks (zero tolerance)
        run: |
          set -euo pipefail
          echo "Running invariant assertion hooks..."
          npx nx run @kryptr/api:test --testPathPattern=invariant --passWithNoTests

  fork-tests:
    if: contains(github.event.pull_request.labels.*.name, 'fork-tests')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Fork tests (public Base RPC, keyless, unit-only)
        run: npx nx run @kryptr/contracts:fork-test
        env:
          RPC_URL_BASE: https://mainnet.base.org

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
