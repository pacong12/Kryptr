name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # Pick the diff base per event. PRs compare against origin/main; on
      # pushes to main, origin/main == HEAD so `nx affected` would see an
      # empty set — use HEAD~1 to validate exactly what was just merged
      # (falling back to the root commit on a single-commit history).
      - name: Compute nx base
        id: nx_base
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "base=origin/main" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-list --max-parents=0 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - run: npx nx format:check --base="${{ steps.nx_base.outputs.base }}"
        if: github.event_name == 'pull_request'

      # Lint/build/test/typecheck/smoke only what changed vs the computed base.
      - run: npx nx affected --base="${{ steps.nx_base.outputs.base }}" -t build test typecheck lint smoke --parallel=3

  # Secret scanning: fail if anything that looks like a real key lands in
  # the repo. GitGuardian alone does not cover pushes from this repo, so
  # gitleaks runs on both PRs and pushes-to-main.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
