name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    # Wave-4 worker suites run against a REAL Redis (no in-memory mock):
    # redis:7-alpine mirrors docker-compose.yml parity, healthcheck-gated so
    # no readiness sleeps are ever needed, reachable at localhost:6379
    # because the job runs directly on the runner.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # Pick the diff base per event. PRs compare against origin/main; on
      # pushes to main, origin/main == HEAD so `nx affected` would see an
      # empty set — use HEAD~1 to validate exactly what was just merged
      # (falling back to the root commit on a single-commit history).
      - name: Compute nx base
        id: nx_base
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "base=origin/main" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-list --max-parents=0 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - run: npx nx format:check --base="${{ steps.nx_base.outputs.base }}"
        if: github.event_name == 'pull_request'

      # Lint/build/test/typecheck/smoke/test-workers only what changed vs
      # the computed base.
      - run: npx nx affected --base="${{ steps.nx_base.outputs.base }}" -t build test typecheck lint smoke test-workers --parallel=3

  # Wave-5 contracts gates (entry gate #2 — present from the FIRST
  # contracts PR, never retrofitted): forge build/test/fmt + Slither
  # triage-baseline scan + deploy-manifest validation. Foundry and Slither
  # are installed ON THE RUNNER here (foundry-toolchain action + pinned
  # slither), never assumed from dev machines. Fork tests stay OUT of
  # default CI (label-gated job below; nightly schedule).
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # forge-std arrives as a pinned git submodule (factory phase);
          # recursive checkout keeps the gates hermetic on the runner.
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Exact pin (Review54 F1): matches the conductor-proven local
          # toolchain; bump deliberately, never float.
          version: v1.7.1

      - name: Install Slither
        run: python3 -m pip install --user slither-analyzer==0.11.6
      - name: Compute nx base
        id: nx_base
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "base=origin/main" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-list --max-parents=0 HEAD)" >> "$GITHUB_OUTPUT"
          fi
      # Only @kryptr/contracts defines these targets, so affected runs them
      # only when contracts/ changed; no-op (green) otherwise.
      # NOTE: no --projects flag — nx would forward it to the commands.
      - name: Contracts gates (forge-build/forge-test/fmt/slither/manifests)
        run: npx nx affected --base="${{ steps.nx_base.outputs.base }}" -t forge-build forge-test fmt slither manifests

  # Fork tests against real Base RPC: OPT-IN via the `fork-tests` PR label
  # (public RPC rate limits/flakes must never gate default CI). Nightly
  # schedule covers the recurring signal.
  fork-tests:
    if: contains(github.event.pull_request.labels.*.name, 'fork-tests')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # UNIT-ONLY on fork by ruling (Main, fork round 31949753694): the
      # 256x128 invariant campaigns saturate the keyless public RPC (HTTP
      # 429) — they run locally on anvil in forge-test; the fork-test target
      # excludes test/invariant/*. Public-RPC rate limits must never gate
      # this job; forked invariant campaigns return with a keyed RPC in the
      # nightly deep campaign.
      - name: Fork tests (public Base RPC, keyless, unit-only)
        run: npx nx run @kryptr/contracts:fork-test
        env:
          RPC_URL_BASE: https://mainnet.base.org

  # Secret scanning: fail if anything that looks like a real key lands in
  # the repo. GitGuardian alone does not cover pushes from this repo, so
  # gitleaks runs on both PRs and pushes-to-main.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
