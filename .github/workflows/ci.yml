name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx nx format:check --base="origin/main"
        if: github.event_name == 'pull_request'

      # Build/test/typecheck only what changed vs the base branch.
      - run: npx nx affected --base="origin/main" -t build test typecheck --parallel=3
