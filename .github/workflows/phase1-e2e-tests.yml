name: Phase 1 E2E Integration Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/tests/e2e/phase1/**'
      - 'apps/api/src/**'
      - 'packages/shared-types/**'
  
  push:
    branches: [main]
    
  schedule:
    - cron: '0 8 * * *'
    
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment'
        required: true
        default: 'ci'
        type: choice
        options:
          - ci
          - local
          - staging

concurrency:
  group: phase1-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1-e2e-runner:
    name: Phase 1 E2E Test Execution
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kryptr_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: kryptr_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Generate shared types
        run: npm run build:shared-types

      - name: Configure environment
        run: |
          cat > .env << EOF
          NODE_ENV=test
          DATABASE_URL=postgresql://kryptr_test:test_password@localhost:5432/kryptr_phase1_test
          REDIS_URL=redis://localhost:6379
          ZEROX_API_KEY=${{ secrets.ZEROX_API_KEY }}
          COINGECKO_API_KEY=${{ secrets.COINGECKO_API_KEY }}
          EOF

      - name: Run Transfer Intent Creation Tests
        name: 🏭 Transfer Intent Creation
        run: |
          cd apps/api
          npx jest tests/e2e/phase1/transfer-intent-creation.spec.ts \
            --config jest.config.cts \
            --coverage \
            --verbose \
            --testResultsProcessor=jest-junit \
            --outputFile=junit-test-results.xml
      
      - name: Run Security Gate Evaluation Tests
        name: 🔒 Security Gate Evaluation
        run: |
          cd apps/api
          npx jest tests/e2e/phase1/security-gate-evaluation.spec.ts \
            --config jest.config.cts \
            --coverage \
            --verbose \
            --testResultsProcessor=jest-junit \
            --outputFile=junit-security-evaluation.xml
      
      - name: Run Persistence Validation Tests
        name: 💾 Persistence Validation
        run: |
          cd apps/api
          npx jest tests/e2e/phase1/persistence-validation.spec.ts \
            --config jest.config.cts \
            --coverage \
            --verbose \
            --testResultsProcessor=jest-junit \
            --outputFile=junit-persistence-validation.xml
      
      - name: Run Backoffice Monitoring Tests
        name: 📊 Backoffice Monitoring
        run: |
          cd apps/api
          npx jest tests/e2e/phase1/backoffice-monitoring.spec.ts \
            --config jest.config.cts \
            --coverage \
            --verbose \
            --testResultsProcessor=jest-junit \
            --outputFile=junit-backoffice-monitoring.xml

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase1-e2e-coverage
          path: |
            apps/api/test-output/jest/coverage
          retention-days: 14

      - name: Upload Jest XML Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-jest-results
          path: |
            apps/api/junit*.xml
          retention-days: 7
